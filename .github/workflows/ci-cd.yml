name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  JAR_NAME: finance-1.0.0.jar

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (compile + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compile and run tests
        run: ./mvnw -B verify

  build:
    name: Build artifact
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Package JAR
        run: ./mvnw -B package -DskipTests

      - name: Verify JAR exists
        run: test -f target/${{ env.JAR_NAME }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-jar
          path: target/${{ env.JAR_NAME }}
          retention-days: 7

  approve:
    name: Approve for production
    needs: build
    # This job will NOT start until you approve it in the GitHub UI.
    # Create the "production" environment in Settings -> Environments and
    # add yourself as a required reviewer. Approving marks this build as the
    # working version that is ready to be deployed to Render manually.
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: finance-jar

      - name: Verify approved artifact
        run: |
          test -f finance-1.0.0.jar
          echo "SHA-256: $(sha256sum finance-1.0.0.jar | cut -d' ' -f1)"

      - name: Mark as deployable
        run: |
          echo "Build approved for production: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This version passed checks, was built, and you approved it. Upload \`finance-1.0.0.jar\` to the Render server (or ask your friend to deploy it)." >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
